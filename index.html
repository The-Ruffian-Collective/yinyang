<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mode Toggle</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            width: 100vw;
            background-color: white;
            transition: background-color 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        body.dark {
            background-color: black;
        }

        .toggle-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            border: none;
            background: none;
            cursor: pointer;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        .toggle-btn:hover {
            transform: scale(1.1);
        }

        .toggle-btn:active {
            transform: scale(0.95);
        }

        .yin-yang {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(90deg, black 50%, white 50%);
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .yin-yang::before,
        .yin-yang::after {
            content: '';
            position: absolute;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            top: 50%;
            left: 50%;
        }

        .yin-yang::before {
            background: white;
            transform: translate(-50%, -100%);
            box-shadow: 0 12.5px 0 black;
        }

        .yin-yang::after {
            background: black;
            transform: translate(-50%, 0%);
            box-shadow: 0 -12.5px 0 white;
        }

        .dark .yin-yang {
            transform: rotate(180deg);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
        }

        /* Add a subtle ripple effect on click */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(128, 128, 128, 0.3);
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
            pointer-events: none;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <button class="toggle-btn" onclick="toggleMode(event)">
        <div class="yin-yang"></div>
    </button>

    <script>
        function toggleMode(event) {
            // Toggle dark mode
            document.body.classList.toggle('dark');
            
            // Create ripple effect
            const button = event.currentTarget;
            const rect = button.getBoundingClientRect();
            const ripple = document.createElement('span');
            
            ripple.classList.add('ripple');
            ripple.style.width = ripple.style.height = '10px';
            ripple.style.left = '20px';
            ripple.style.top = '20px';
            
            button.appendChild(ripple);
            
            setTimeout(() => {
                ripple.remove();
            }, 600);
        }

        // Add keyboard support
        document.addEventListener('keydown', function(event) {
            if (event.code === 'Space' || event.code === 'Enter') {
                toggleMode({ currentTarget: document.querySelector('.toggle-btn') });
                event.preventDefault();
            }
        });
    </script>
</body>
</html>
